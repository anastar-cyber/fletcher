<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Fletcher — Your personal cupid</title>
  <meta name="description" content="Fletcher gives you a personal AI cupid who gets to know you, meets other people's Fletchers, and finds your people." />
  <meta name="theme-color" content="#F7F1EA" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="brand" aria-hidden="true">
    <div class="brand__mark">Fletcher</div>
    <p class="brand__line">Your personal cupid.<br /><em>Taking it seriously so you don’t have to.</em></p>
    <p class="brand__foot">© 2026 Fletcher Labs</p>
  </aside>

  <main class="phone" aria-label="Chat with Fletcher">
    <header class="thread-header">
      <div class="thread-header__side"></div>
      <div class="thread-header__who">
        <div class="avatar avatar--sm" data-cupid></div>
        <div class="thread-header__name">Fletcher</div>
        <div class="thread-header__sub" id="status">Your personal cupid</div>
      </div>
      <div class="thread-header__side thread-header__side--end">
        <button class="icon-btn" id="menu-btn" aria-label="Conversation options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
        <div class="menu" id="menu" role="menu" hidden>
          <button role="menuitem" id="profile-btn" hidden>Your profile</button>
          <button role="menuitem" id="demo-btn" hidden>Watch the demo</button>
          <button role="menuitem" id="restart-btn">Start over</button>
        </div>
      </div>
      <div class="progress" id="progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="0" aria-valuemax="100"></div>
    </header>

    <section class="thread" id="thread" aria-live="polite" aria-relevant="additions">
      <div class="contact-card">
        <div class="avatar avatar--lg" data-cupid data-flutter></div>
        <h1 class="contact-card__name">Fletcher</h1>
        <p class="contact-card__sub">Your personal cupid</p>
      </div>
      <div class="stamp" id="stamp"></div>
      <div id="messages"></div>
    </section>

    <footer class="composer-wrap">
      <div class="chips" id="chips" role="group" aria-label="Quick replies"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button class="attach" id="attach" type="button" aria-label="Add a photo" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="10.5" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
        </button>
        <input type="file" id="file" accept="image/*" hidden />
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Message Fletcher" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M12 5l-6 6M12 5l6 6"/></svg>
        </button>
      </form>
    </footer>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet__bar">
        <button class="icon-btn" id="sheet-close" type="button" aria-label="Close profile">
          <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <h2 class="sheet__title" id="sheet-title">Your profile</h2>
        <span class="sheet__spacer"></span>
      </div>
      <div class="sheet__body" id="sheet-body"></div>
      <div class="sheet__foot" id="sheet-foot"></div>
      <input type="file" id="sheet-file" accept="image/*" hidden />
    </div>

    <div class="sheet demo" id="demo" role="dialog" aria-modal="true" aria-labelledby="demo-title" hidden>
      <div class="sheet__bar">
        <button class="icon-btn" id="demo-close" type="button" aria-label="Close demo">
          <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <h2 class="sheet__title" id="demo-title">Fletcher meets Fletcher</h2>
        <span class="sheet__spacer"></span>
      </div>
      <div class="sheet__body demo__body" id="demo-body"></div>
      <div class="sheet__foot" id="demo-foot"></div>
    </div>

    <div class="flyoff" id="flyoff" aria-hidden="true"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
